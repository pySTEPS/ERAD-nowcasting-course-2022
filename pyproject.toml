[project]
name = "opensense-pysteps-nowcasting-2025"
version = "0.1.0"
description = "Training school material and tutorial for the OpenSense training school in Budapest, Hungary, 2025"
authors = [
    {name = "Jenna Ritvanen, Ruben Imhoff"}
]
license = {text = "BSD 3-Clause License"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rasterio (>=1.4.3,<2.0.0)",
    "geopandas (>=1.0.1,<2.0.0)",
    "cython (>=3.0.12,<4.0.0)",
    "xarray (>=2025.1.2,<2026.0.0)",
    "rioxarray (>=0.18.2,<0.19.0)",
    "numpy (>=2.2.2,<3.0.0)",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "pillow (>=11.1.0,<12.0.0)",
    "pyproj (>=3.7.0,<4.0.0)",
    "scipy (>=1.15.1,<2.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "jsonschema (>=4.23.0,<5.0.0)",
    "netcdf4 (>=1.7.2,<2.0.0)",
    "h5py (>=3.12.1,<4.0.0)",
    "toolz (>=1.0.0,<2.0.0)",
    "pyfftw (>=0.15.0,<0.16.0)",
    "scikit-image (>=0.25.1,<0.26.0)",
    "scikit-learn (>=1.6.1,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "pysteps (>=1.14.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
